# Database services for the manual QA environment. Run through `npm run qa:up`, which
# generates the seed files first. Values come from test/qa/.env (see .env.example).
name: db-studio-qa

services:
  postgres:
    image: postgres:${POSTGRES_VERSION:?set POSTGRES_VERSION in test/qa/.env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-54329}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shop}
      POSTGRES_USER: ${POSTGRES_USER:-shop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in test/qa/.env}
    volumes:
      - ./postgres/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./data/postgres-data.sql:/docker-entrypoint-initdb.d/02-data.sql:ro
    healthcheck:
      # TCP on purpose: the init-time server only listens on the socket, so "healthy" means seeded.
      test: ["CMD-SHELL", 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 2s
      timeout: 3s
      retries: 30
