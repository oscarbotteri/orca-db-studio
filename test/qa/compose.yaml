# Database services for the manual QA environment. Run through `npm run qa:up`, which
# generates the seed files first. Values come from test/qa/.env (see .env.example).
name: db-studio-qa

services:
  postgres:
    image: postgres:${POSTGRES_VERSION:?set POSTGRES_VERSION in test/qa/.env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-54329}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shop}
      POSTGRES_USER: ${POSTGRES_USER:-shop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in test/qa/.env}
    volumes:
      - ./postgres/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./data/postgres-data.sql:/docker-entrypoint-initdb.d/02-data.sql:ro
    healthcheck:
      # TCP on purpose: the init-time server only listens on the socket, so "healthy" means seeded.
      test: ["CMD-SHELL", 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 2s
      timeout: 3s
      retries: 30

  mariadb:
    image: mariadb:${MARIADB_VERSION:?set MARIADB_VERSION in test/qa/.env}
    ports:
      - "127.0.0.1:${MARIADB_PORT:-33306}:3306"
    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE:-shop}
      MARIADB_USER: ${MARIADB_USER:-shop}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?set MARIADB_PASSWORD in test/qa/.env}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?set MARIADB_ROOT_PASSWORD in test/qa/.env}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - ./mariadb/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./data/mariadb-data.sql:/docker-entrypoint-initdb.d/02-data.sql:ro
    healthcheck:
      # --connect uses TCP, which the init-time server does not open, so "healthy" means seeded.
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
